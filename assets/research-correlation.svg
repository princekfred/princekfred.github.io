<text x="37" y="48" font-family="Arial,sans-serif" font-size="12" letter-spacing="3" font-weight="600" fill="#a3d8d4">STRONGLY CORRELATED SYSTEMS</text><path d="M38 64H100" stroke="#79c9c5" stroke-width="2"/>

